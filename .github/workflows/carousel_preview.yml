name: Carousel preview
on:
  workflow_dispatch:
  # To get a preview automatically every day, remove the # from the next 2 lines.
  # (cron uses UTC: "1 0 * * *" = 8:01 am Malaysia time)
  # schedule:
  #   - cron: "1 0 * * *"
permissions:
  contents: write
concurrency:
  group: carousel
  cancel-in-progress: false
jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests playwright
      - run: playwright install --with-deps chromium
      - run: python carousel_preview.py
        env:
          TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - if: success()
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A pending pending.json history.json
          git diff --cached --quiet || (git commit -m "carousel preview" && git pull --rebase && git push)
