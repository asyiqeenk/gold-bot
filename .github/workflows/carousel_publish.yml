name: Carousel publish
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: carousel
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - id: post
        run: python carousel_publish.py
        env:
          TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          IG_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IMAGES_REPO_TOKEN: ${{ secrets.IMAGES_REPO_TOKEN }}
      - if: always()
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add pending.json
          git diff --cached --quiet || (git commit -m "carousel posted" && git pull --rebase && git push)
