name: Gold Bot
on:
  schedule:
    - cron: "16,36,56 * * * *"
    - cron: "1 16 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: gold-bot
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python gold_bot.py
        env:
          TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - run: python jewel_bot.py
        if: always()
        env:
          TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - if: always()
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add last_price.json last_jewel.json
          git diff --cached --quiet || (git commit -m "update price" && git pull --rebase && git push)
